[project]
name = "ai-service-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "UESTCHh", email = "202522011306@std.uestc.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
ai-service-demo = "ai_service_demo:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
[tool.uv]
package = false
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
